version: "3"

tasks:
  install:
    desc: Install production dependencies
    cmds:
      - uv sync

  dev:
    desc: Install all dependencies including dev
    cmds:
      - uv sync --all-extras

  lint:
    desc: Run linter
    cmds:
      - uv run ruff check src tests

  lint-fix:
    desc: Run linter with auto-fix
    cmds:
      - uv run ruff check --fix src tests

  format:
    desc: Format code
    cmds:
      - uv run ruff format src tests

  format-check:
    desc: Check formatting without making changes
    cmds:
      - uv run ruff format --check src tests

  typecheck:
    desc: Run type checking
    cmds:
      - uv run pyright

  test:
    desc: Run tests
    cmds:
      - uv run pytest

  test-cov:
    desc: Run tests with coverage report
    cmds:
      - uv run pytest --cov=italian_db --cov-report=term-missing

  check:
    desc: Run all checks (format, lint, typecheck, test)
    cmds:
      - task: format-check
      - task: lint
      - task: typecheck
      - task: test

  pre-commit-install:
    desc: Install pre-commit hooks
    cmds:
      - uv run pre-commit install

  pre-commit-run:
    desc: Run pre-commit on all files
    cmds:
      - uv run pre-commit run --all-files

  import-wiktextract:
    desc: Import Wiktextract data into database
    cmds:
      - uv run italian-db import-wiktextract {{if .POS}}--pos {{.POS}}{{end}}

  enrich-formof:
    desc: Enrich forms with register labels from form-of entries
    cmds:
      - uv run italian-db enrich-formof {{if .POS}}--pos {{.POS}}{{end}}

  import-frequencies:
    desc: Compute frequency data from Stanza sentence tokens
    cmds:
      - uv run italian-db import-frequencies

  import-tatoeba:
    desc: Import Tatoeba sentences and link to verbs
    cmds:
      - uv run italian-db import-tatoeba

  import-opensubtitles-sentences:
    desc: Import OpenSubtitles sentences
    cmds:
      - uv run italian-db import-opensubtitles-sentences

  import-verb-irregularity:
    desc: Import verb irregularity pattern classifications
    cmds:
      - uv run italian-db import-verb-irregularity

  import-sentence-tokens:
    desc: Import POS-tagged sentence tokens from Stanza JSONL
    cmds:
      - uv run italian-db import-sentence-tokens {{if .SOURCE}}--source {{.SOURCE}}{{end}}

  import-profilo:
    desc: Import Profilo CEFR level data
    cmds:
      - uv run italian-db import-profilo

  import-nvdb:
    desc: Import NVdB usage tier data
    cmds:
      - uv run italian-db import-nvdb

  import-all:
    desc: Run full import pipeline
    cmds:
      - uv run italian-db import-all

  stats:
    desc: Show database statistics
    cmds:
      - uv run italian-db stats

  verify-db:
    desc: Verify database integrity and consistency
    cmds:
      - uv run italian-db verify {{if .VERBOSE}}-v{{end}}

  download-wiktextract:
    desc: Download Wiktextract Italian dictionary
    cmds:
      - uv run italian-db download-wiktextract {{if .FORCE}}--force{{end}}

  download-tatoeba:
    desc: Download Tatoeba sentences and links
    cmds:
      - uv run italian-db download-tatoeba {{if .FORCE}}--force{{end}}

  download-opensubtitles:
    desc: Download OpenSubtitles parallel sentences from OPUS
    cmds:
      - uv run italian-db download-opensubtitles {{if .FORCE}}--force{{end}}

  download-profilo:
    desc: Download Profilo CEFR word lists
    cmds:
      - uv run italian-db download-profilo {{if .FORCE}}--force{{end}}

  download-nvdb:
    desc: Download NVdB vocabulary list
    cmds:
      - uv run italian-db download-nvdb {{if .FORCE}}--force{{end}}

  download-all:
    desc: Download all data sources
    cmds:
      - uv run italian-db download-all {{if .FORCE}}--force{{end}}

  generate-deck:
    desc: Generate Anki deck from database
    cmds:
      - uv run anki-gen generate {{if .OUTPUT}}-o {{.OUTPUT}}{{end}}

  preview-card:
    desc: Preview a card in browser
    cmds:
      - uv run anki-gen preview {{.VERB | default "parlare"}}
      - open output/preview.html

  wikt-query:
    desc: Interactive DuckDB session for querying raw Wiktextract data
    cmds:
      - uv run python -i scripts/wikt_query.py

  tatoeba-query:
    desc: Interactive DuckDB session for querying raw Tatoeba data
    cmds:
      - uv run python -i scripts/tatoeba_query.py

  data-query:
    desc: Interactive DuckDB session with ALL source data loaded
    cmds:
      - uv run python -i scripts/data_query.py

  stanza-download:
    desc: Download Stanza Italian model for POS tagging
    cmds:
      - uv run python -c "import stanza; stanza.download('it')"

  stanza-pos-tag:
    desc: Run Stanza POS tagging on sentences (one-off preprocessing)
    cmds:
      - uv run python scripts/stanza_pos_tagging.py {{if .SOURCE}}--source {{.SOURCE}}{{end}} {{if .CK_ONLY}}--ck-only{{end}}

  stanza-pos-tag-opensubtitles:
    desc: Run Stanza POS tagging on OpenSubtitles sentences
    cmds:
      - uv run python scripts/stanza_pos_tagging.py --source opensubtitles

  sentence-coverage:
    desc: Analyze sentence coverage for morphological matching
    cmds:
      - uv run python scripts/sentence_coverage_analysis.py
