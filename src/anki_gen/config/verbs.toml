# Curated verb list for Phase 1
#
# 32 irregular verbs representing unique irregularity patterns,
# plus 4 regular verbs covering all conjugation classes.
#
# Selection methodology from SPEC.md:
# - Irregular verbs: one representative per unique pattern, highest frequency
# - Regular verbs: manually selected to cover -are, -ere, -ire (non-isc), -ire (isc)
#
# Updated 2026-02: Re-selected using Stanza/Tatoeba frequencies, CEFR, and NVdB

