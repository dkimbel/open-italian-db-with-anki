# Curated semantic categories for learner-friendly tagging.
#
# Each category is anchored to one or more real IWN synset IDs.
# The derivation algorithm walks hypernym chains from a lemma's synsets
# and assigns the category when any synset in the chain matches an anchor.
#
# Selection criteria for categories:
# - Learner utility: Would a student want to study "all animal words" together?
# - Reasonable size: 50-500 lemmas (not 2, not 10,000)
# - Clear boundaries: "animal" is clear; "thing" is too vague
#
# To find anchor synset IDs, use: task iwn-query
# Example:
#   find_synsets_for_lemma(conn, 'animale')
#   walk_hypernym_chain(conn, 'iwn-00000228-n')
#
# NOTE: Categories without anchor_synsets are placeholders for future research.

[categories.animal]
display_name = "Animals"
# iwn-00000228-n: "essere vivente che si nutre di sostanze organiche"
anchor_synsets = ["iwn-00000228-n"]

